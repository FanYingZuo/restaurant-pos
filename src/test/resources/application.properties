# 測試預設使用開發環境；測試「預設為正式」時以 @TestPropertySource 覆寫。
spring.profiles.active=dev
# 測試用的信任代理（假位址），驗證 X-Forwarded-For 只在來自信任代理時才採信。
restaurantpos.trusted-proxies=10.9.9.9
# 測試用較短的 WebSocket 心跳與裝置重新檢查週期（正式預設 25 秒，§4.5、S6）。
restaurantpos.ws.heartbeat-ms=1000
# 測試時顯示 Hibernate 統計，用來驗證廚房清單是單一固定次數查詢。
spring.jpa.properties.hibernate.generate_statistics=true
# 統計只用來計數，不要把每個 Session 的統計印到主控台。
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
