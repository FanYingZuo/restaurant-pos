        menuItemId: {type: integer, format: int64}
        name: {type: string}
        basePrice: {$ref: '#/components/schemas/Money'}
        unitPrice: {$ref: '#/components/schemas/Money'}
        quantity: {type: integer}
        lineTotal: {$ref: '#/components/schemas/Money'}
        station: {$ref: '#/components/schemas/Station'}
        modifiers:
          type: array
          items: {$ref: '#/components/schemas/ItemModifierView'}
        note: {type: string}
        status: {$ref: '#/components/schemas/ItemStatus'}
        version: {type: integer, description: 狀態／數量／選項／備註變更時 +1}
