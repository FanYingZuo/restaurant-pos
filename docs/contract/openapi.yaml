      summary: 送出草稿（出單）
      description: |
        流程：驗證請求編號 → 鎖用餐紀錄 → 冪等重播（同編號回原結果，不論內容）→ 結帳中拒絕 → 空草稿拒絕 → 每項**重新**檢查可售與選項（任一失敗整張失敗）→ 轉正式單 → 寫歷史 → 發佈訂單送出。
        批次號＝該用餐紀錄最大批次＋1；同時出單只一個成功且批次號不重複。新建立回 201，重播回 200（`replayed` 為 true）。
        `note` 為訂單備註（0～255 字）。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
