openapi: 3.0.3
info:
  title: 餐廳 QR 點餐＋POS 系統 API 合約
  version: 1.0.0
  description: |
    **狀態：已凍結 1.0.0（卡 1.7，使用者已確認）。變更需使用者同意並更新版本。** 規格來源：docs/plan/01-PLAN.md；本檔由 docs/contract/fragments/*.yaml 以 merge.sh 合併產生，請改片段檔，不要直接改本檔。

    ## 通則（01-PLAN §4.4、§4.5、§4.8）
    - JSON、欄位駝峰；成功直接回物件或陣列，不包外層；null 照樣輸出；ID 為數字；帳單號為三位數補零字串（如 "001"）。
    - 時間為 ISO-8601 UTC 字串；營業日為 `yyyy-MM-dd`；金額為整數（元）；列舉為大寫字串。
    - 字串先去頭尾空白；選填空白視為未提供；超長度上限回 `VALIDATION_ERROR`。
    - 前端傳來的價格、小計、總額一律不採用，只接受品項 ID 與選項 ID。
    - 分頁：`page`（預設 0，負數視為 0）、`size`（預設 10、最大 100）；回應含 `content`、`page`、`size`、`totalElements`、`totalPages`。

    ## 路徑與裝置類型（§4.5）
    | 路徑 | 認證 | 允許的裝置類型 |
    | --- | --- | --- |
    | `/api/pairing` | 無（唯一豁免裝置憑證的店內路徑），以來源 IP 防暴力 | — |
    | `/api/staff/**`、`/api/pos/**` | `X-Device-Token` | POS |
    | `/api/kds/**` | `X-Device-Token` | KDS |
    | `/ws`（STOMP） | CONNECT 帧 `X-Device-Token` | KDS、POS |
    | `/api/customer/menu`、`/api/customer/images/**` | 無 | — |
    | `/api/customer/sessions/**` | `X-Session-Token` | — |

    每個需裝置憑證的操作都可能回 401 `DEVICE_TOKEN_INVALID`、403 `DEVICE_TYPE_FORBIDDEN`、500 `INTERNAL_ERROR`，不在各操作重複列出。
    每個有請求內容的操作都可能回 400 `VALIDATION_ERROR`。

    ## 各操作的錯誤碼
    每個操作的 `x-error-codes` 以「HTTP 狀態 → 錯誤碼清單」列出該操作可能回的業務錯誤碼；狀態碼只是粗分類，**前端一律看錯誤碼判斷**（§4.8）。列在同一狀態內的順序即「檢查順序」（規格有明訂順序者）。

    ## 冪等（§4.6）
    - 服務員送出草稿：`requestId`（Session 內唯一）；同編號回原結果，不論內容。
    - 顧客送單：`requestId` ＋ 內容雜湊；同編號同內容回原結果；內容不同回 409 `DUPLICATE_REQUEST`。
    - 付款：`paymentKey`（帳單內唯一）；同鍵同內容回目前帳單；內容不同回 409 `PAYMENT_IDEMPOTENCY_CONFLICT`。
    - `requestId`、`paymentKey`：1～64 字，只允許英數字、底線、連字號。
servers:
  - url: http://localhost:8080
    description: 開發環境（正式環境無 Swagger）
security:
  - DeviceToken: []
tags:
  - {name: pairing, description: 裝置配對（無需裝置憑證）}
  - {name: staff, description: 員工、打卡、解鎖、出勤更正、稽核}
  - {name: device, description: 裝置管理}
  - {name: menu, description: 菜單管理}
  - {name: table, description: 桌位與用餐紀錄}
  - {name: order, description: 訂單}
  - {name: kds, description: 廚房}
  - {name: customer, description: 顧客端}
  - {name: checkout, description: 結帳與付款}
  - {name: report, description: 報表與日結}
  - {name: print, description: 列印問題與重印}
paths:
  /api/pairing:
    post:
      tags: [pairing]
      operationId: pairDevice
      summary: 以配對碼取得裝置憑證
      description: |
        **唯一豁免裝置憑證的店內路徑**（Security 設定須明列）。配對碼一次性、10 分鐘有效；憑證 `deviceToken` **只在本回應出現一次**，配對碼立即失效。
        錯誤不區分「不存在」「已過期」「已使用」。防暴力以來源 IP 計算：10 分鐘內錯 10 次鎖 10 分鐘。
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PairRequest'}}}
      responses:
        '200': {description: 配對成功, content: {application/json: {schema: {$ref: '#/components/schemas/PairResponse'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [PAIRING_CODE_INVALID], 429: [PAIRING_LOCKED]}
  /api/staff/clock-in:
    post:
      tags: [staff]
      operationId: clockIn
      summary: 上班打卡（PIN）
      description: 兩次打卡至少間隔 60 秒；上班中不能再上班。前一營業日忘記下班 → 該班記為「下班未打卡」，不計工時、不擋今天打卡。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PinRequest'}}}
      responses:
        '200': {description: 打卡成功, content: {application/json: {schema: {$ref: '#/components/schemas/ClockResult'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '409': {$ref: '#/components/responses/E409'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 409: [ALREADY_CLOCKED_IN], 429: [PIN_LOCKED, CLOCK_TOO_FAST]}
  /api/staff/clock-out:
    post:
      tags: [staff]
      operationId: clockOut
      summary: 下班打卡（PIN）
      description: 沒上班就下班 → 另記一筆「上班未打卡」班次，不計工時。分鐘數無條件捨去。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PinRequest'}}}
      responses:
        '200': {description: 打卡成功, content: {application/json: {schema: {$ref: '#/components/schemas/ClockResult'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 429: [PIN_LOCKED, CLOCK_TOO_FAST]}
  /api/staff/clock-status:
    post:
      tags: [staff]
      operationId: getClockStatus
      summary: 查詢打卡狀態（只驗 PIN，不打卡）
      description: 使用 POST 是為了 PIN 放在請求內容而非網址。不受 60 秒間隔限制。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PinRequest'}}}
      responses:
        '200': {description: 目前狀態, content: {application/json: {schema: {$ref: '#/components/schemas/ClockResult'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 429: [PIN_LOCKED]}
  /api/staff/clock-history:
    get:
      tags: [staff]
      operationId: getClockHistory
      summary: 打卡歷史
      description: 天數以營業日計，含今天往前算。需管理者解鎖（EMPLOYEE_MANAGE）。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: employeeId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: days, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 31, default: 2}}
      responses:
        '200': {description: 班次清單（新到舊）, content: {application/json: {schema: {$ref: '#/components/schemas/ClockHistory'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
        '403': {$ref: '#/components/responses/E403'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [FORBIDDEN], 404: [EMPLOYEE_NOT_FOUND]}
  /api/staff/unlock:
    post:
      tags: [staff]
      operationId: unlock
      summary: 管理者解鎖（管理者 PIN 換單一功能憑證）
      description: |
        憑證為 32 位元組隨機值（網址安全 base64），只對 `function` 有效；閒置 30 分鐘、解鎖者停用或不再是管理者、服務重啟、呼叫釋放 API 時失效。寫稽核。
        後續請求帶 `X-Unlock-Token`；憑證缺少、無效、已失效、或功能不符，一律回 403 `FORBIDDEN`。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UnlockRequest'}}}
      responses:
        '200': {description: 解鎖成功, content: {application/json: {schema: {$ref: '#/components/schemas/UnlockResponse'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN, NOT_MANAGER], 429: [PIN_LOCKED]}
    delete:
      tags: [staff]
      operationId: releaseUnlock
      summary: 釋放解鎖憑證（離開管控頁面時呼叫）
      description: 冪等；憑證已失效或不存在也回 204。
      security:
        - DeviceToken: []
          UnlockToken: []
      responses:
        '204': {description: 已釋放}
  /api/staff/employees:
    get:
      tags: [staff]
      operationId: listEmployees
      summary: 員工列表（EMPLOYEE_MANAGE）
      description: 不回 PIN 或其雜湊。含已停用員工。
      security:
        - DeviceToken: []
          UnlockToken: []
      responses:
        '200': {description: 員工, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Employee'}}}}}
        '403': {$ref: '#/components/responses/E403'}
      x-error-codes: {403: [FORBIDDEN]}
    post:
      tags: [staff]
      operationId: createEmployee
      summary: 新增員工（EMPLOYEE_MANAGE）
      description: PIN 4～6 位數字，全店唯一（只比對在職員工）。
      security:
        - DeviceToken: []
          UnlockToken: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeCreate'}}}
      responses:
        '201': {description: 已建立, content: {application/json: {schema: {$ref: '#/components/schemas/Employee'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [FORBIDDEN], 409: [PIN_ALREADY_USED]}
  /api/staff/employees/{employeeId}:
    patch:
      tags: [staff]
      operationId: updateEmployee
      summary: 改名與角色（EMPLOYEE_MANAGE）
      description: 至少保留一位在職管理者；降級最後一位管理者回 `LAST_MANAGER`。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: employeeId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EmployeeUpdate'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/Employee'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [FORBIDDEN], 404: [EMPLOYEE_NOT_FOUND], 409: [LAST_MANAGER]}
  /api/staff/employees/{employeeId}/pin:
    put:
      tags: [staff]
      operationId: changeEmployeePin
      summary: 換 PIN（EMPLOYEE_MANAGE）
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: employeeId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PinRequest'}}}
      responses:
        '204': {description: 已更換}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [FORBIDDEN], 404: [EMPLOYEE_NOT_FOUND], 409: [PIN_ALREADY_USED]}
  /api/staff/employees/{employeeId}/deactivate:
    post:
      tags: [staff]
      operationId: deactivateEmployee
      summary: 停用員工（EMPLOYEE_MANAGE）
      description: 軟刪除；清空 PIN 雜湊；最後一位在職管理者不可停用。停用後驗 PIN 回 `INVALID_PIN`，不洩漏「已停用」。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: employeeId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 已停用, content: {application/json: {schema: {$ref: '#/components/schemas/Employee'}}}}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {403: [FORBIDDEN], 404: [EMPLOYEE_NOT_FOUND], 409: [LAST_MANAGER]}
  /api/staff/shifts:
    post:
      tags: [staff]
      operationId: createShift
      summary: 出勤更正：新增完整班次（EMPLOYEE_MANAGE）
      description: |
        理由必填；下班晚於上班且不晚於現在；限 31 天內；不能改自己的班次（唯一管理者例外）；寫更正歷史與稽核；班次標記「已更正」。
        更正者為持有解鎖憑證的管理者。
      security:
        - DeviceToken: []
          UnlockToken: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ShiftCreate'}}}
      responses:
        '201': {description: 已新增, content: {application/json: {schema: {$ref: '#/components/schemas/ShiftRecord'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR, SHIFT_CORRECTION_INVALID, SHIFT_CORRECTION_TOO_OLD], 403: [FORBIDDEN, SHIFT_CORRECTION_SELF], 404: [EMPLOYEE_NOT_FOUND]}
  /api/staff/shifts/{shiftId}:
    patch:
      tags: [staff]
      operationId: correctShift
      summary: 出勤更正：補上班或下班時間、修改既有班次（EMPLOYEE_MANAGE）
      description: 規則同新增；班次不提供刪除。`shiftId` 來自打卡歷史。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: shiftId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ShiftUpdate'}}}
      responses:
        '200': {description: 已更正, content: {application/json: {schema: {$ref: '#/components/schemas/ShiftRecord'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR, SHIFT_CORRECTION_INVALID, SHIFT_CORRECTION_TOO_OLD], 403: [FORBIDDEN, SHIFT_CORRECTION_SELF], 404: [NOT_FOUND]}
  /api/staff/audit-logs:
    get:
      tags: [staff]
      operationId: listAuditLogs
      summary: 稽核查詢（EMPLOYEE_MANAGE）
      description: 依日期（營業日）與動作篩選；預設依 ID 遞增。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: action, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: page, in: query, required: false, schema: {type: integer, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, default: 10, maximum: 100}}
      responses:
        '200': {description: 稽核紀錄, content: {application/json: {schema: {$ref: '#/components/schemas/AuditLogPage'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_DATE_RANGE], 403: [FORBIDDEN]}
  /api/staff/devices:
    get:
      tags: [device]
      operationId: listDevices
      summary: 裝置列表（DEVICE_MANAGE）
      description: 不回憑證、憑證雜湊或配對碼。含已撤銷裝置。
      security:
        - DeviceToken: []
          UnlockToken: []
      responses:
        '200': {description: 裝置, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Device'}}}}}
        '403': {$ref: '#/components/responses/E403'}
      x-error-codes: {403: [FORBIDDEN]}
    post:
      tags: [device]
      operationId: createDevice
      summary: 建立裝置並取得配對碼（DEVICE_MANAGE）
      description: 配對碼 8 位英數字、10 分鐘有效，**只在本回應出現**。寫稽核。
      security:
        - DeviceToken: []
          UnlockToken: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeviceCreate'}}}
      responses:
        '201': {description: 已建立, content: {application/json: {schema: {$ref: '#/components/schemas/DevicePairing'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [FORBIDDEN]}
  /api/staff/devices/{deviceId}/pairing-code:
    post:
      tags: [device]
      operationId: regeneratePairingCode
      summary: 重新產生配對碼（DEVICE_MANAGE）
      description: 舊配對碼立即失效。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 新配對碼, content: {application/json: {schema: {$ref: '#/components/schemas/DevicePairing'}}}}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {403: [FORBIDDEN], 404: [NOT_FOUND]}
  /api/staff/devices/{deviceId}/revoke:
    post:
      tags: [device]
      operationId: revokeDevice
      summary: 撤銷裝置（DEVICE_MANAGE）
      description: 立即生效（WebSocket 下次心跳斷線）；不可撤銷自己正在用的裝置；寫稽核。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 已撤銷, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {403: [FORBIDDEN, DEVICE_SELF_REVOKE], 404: [NOT_FOUND]}
  /api/pos/menu:
    get:
      tags: [menu]
      operationId: getMenuTree
      summary: 完整菜單樹（管理與點餐用）
      description: |
        分類 → 品項 → 選項群組 → 選項，皆依顯示順序，只含未刪除項目（含下架的分類與品項）。
        品項的 `sellable` 為查詢時計算：品項上架、分類上架、售完日不是今天、每個群組的選項數 ≥ 最少可選。
        POS 點餐畫面以 `sellable` 決定是否可選；顧客菜單另見 `getCustomerMenu`。
      responses:
        '200': {description: 菜單樹, content: {application/json: {schema: {$ref: '#/components/schemas/MenuTree'}}}}
  /api/pos/menu/categories:
    post:
      tags: [menu]
      operationId: createCategory
      summary: 新增分類
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CategoryCreate'}}}
      responses:
        '201': {description: 已建立, content: {application/json: {schema: {$ref: '#/components/schemas/MenuCategory'}}}}
        '400': {$ref: '#/components/responses/E400'}
      x-error-codes: {400: [VALIDATION_ERROR]}
  /api/pos/menu/categories/{categoryId}:
    patch:
      tags: [menu]
      operationId: updateCategory
      summary: 修改分類（含上下架）
      description: 分類下仍有上架品項時不可下架。
      parameters:
        - {name: categoryId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CategoryUpdate'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/MenuCategory'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 404: [MENU_CATEGORY_NOT_FOUND], 409: [MENU_CATEGORY_IN_USE]}
    delete:
      tags: [menu]
      operationId: deleteCategory
      summary: 刪除分類（軟刪除）
      description: 分類下仍有（未刪除）品項不可刪。
      parameters:
        - {name: categoryId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '204': {description: 已刪除}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {404: [MENU_CATEGORY_NOT_FOUND], 409: [MENU_CATEGORY_IN_USE]}
  /api/pos/menu/categories/order:
    put:
      tags: [menu]
      operationId: reorderCategories
      summary: 分類排序
      description: 提交的編號列表必須剛好等於所有未刪除分類；依位置從 0 重新編號。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReorderRequest'}}}
      responses:
        '204': {description: 已排序}
        '400': {$ref: '#/components/responses/E400'}
      x-error-codes: {400: [INVALID_SORT_REQUEST]}
  /api/pos/menu/categories/{categoryId}/items/order:
    put:
      tags: [menu]
      operationId: reorderItems
      summary: 分類內品項排序
      description: 列表必須剛好等於該分類所有未刪除品項。
      parameters:
        - {name: categoryId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReorderRequest'}}}
      responses:
        '204': {description: 已排序}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [INVALID_SORT_REQUEST], 404: [MENU_CATEGORY_NOT_FOUND]}
  /api/pos/menu/items:
    post:
      tags: [menu]
      operationId: createItem
      summary: 新增品項
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ItemCreate'}}}
      responses:
        '201': {description: 已建立, content: {application/json: {schema: {$ref: '#/components/schemas/MenuItem'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_PRICE], 404: [MENU_CATEGORY_NOT_FOUND]}
  /api/pos/menu/items/{itemId}:
    patch:
      tags: [menu]
      operationId: updateItem
      summary: 修改品項（含改價、上下架）
      description: 改價寫稽核；改價改名不影響既有訂單。重新上架不清除售完日。
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ItemUpdate'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/MenuItem'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_PRICE], 404: [MENU_ITEM_NOT_FOUND]}
    delete:
      tags: [menu]
      operationId: deleteItem
      summary: 刪除品項（軟刪除）
      description: 需先下架才可刪。
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '204': {description: 已刪除}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {404: [MENU_ITEM_NOT_FOUND], 409: [MENU_ITEM_NOT_ARCHIVED]}
  /api/pos/menu/items/{itemId}/sold-out:
    post:
      tags: [menu]
      operationId: markItemSoldOut
      summary: 設為售完（今天營業日）
      description: 隔日自動恢復。已售完時重複呼叫回目前狀態。
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 已設定, content: {application/json: {schema: {$ref: '#/components/schemas/MenuItem'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [MENU_ITEM_NOT_FOUND]}
    delete:
      tags: [menu]
      operationId: clearItemSoldOut
      summary: 手動恢復供應
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 已恢復, content: {application/json: {schema: {$ref: '#/components/schemas/MenuItem'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [MENU_ITEM_NOT_FOUND]}
  /api/pos/menu/items/{itemId}/modifier-groups:
    post:
      tags: [menu]
      operationId: createModifierGroup
      summary: 新增選項群組
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ModifierGroupCreate'}}}
      responses:
        '201': {description: 已建立, content: {application/json: {schema: {$ref: '#/components/schemas/ModifierGroup'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR], 404: [MENU_ITEM_NOT_FOUND]}
  /api/pos/menu/items/{itemId}/modifier-groups/order:
    put:
      tags: [menu]
      operationId: reorderModifierGroups
      summary: 品項內選項群組排序
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReorderRequest'}}}
      responses:
        '204': {description: 已排序}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [INVALID_SORT_REQUEST], 404: [MENU_ITEM_NOT_FOUND]}
  /api/pos/menu/modifier-groups/{groupId}:
    patch:
      tags: [menu]
      operationId: updateModifierGroup
      summary: 修改選項群組
      description: 最少 ≤ 最多。
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ModifierGroupUpdate'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/ModifierGroup'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR], 404: [MODIFIER_GROUP_NOT_FOUND]}
    delete:
      tags: [menu]
      operationId: deleteModifierGroup
      summary: 刪除選項群組（連同選項軟刪除）
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '204': {description: 已刪除}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [MODIFIER_GROUP_NOT_FOUND]}
  /api/pos/menu/modifier-groups/{groupId}/modifiers:
    post:
      tags: [menu]
      operationId: createModifier
      summary: 新增選項
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ModifierCreate'}}}
      responses:
        '201': {description: 已建立, content: {application/json: {schema: {$ref: '#/components/schemas/Modifier'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_PRICE], 404: [MODIFIER_GROUP_NOT_FOUND]}
  /api/pos/menu/modifier-groups/{groupId}/modifiers/order:
    put:
      tags: [menu]
      operationId: reorderModifiers
      summary: 群組內選項排序
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReorderRequest'}}}
      responses:
        '204': {description: 已排序}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [INVALID_SORT_REQUEST], 404: [MODIFIER_GROUP_NOT_FOUND]}
  /api/pos/menu/modifiers/{modifierId}:
    patch:
      tags: [menu]
      operationId: updateModifier
      summary: 修改選項（含加價）
      description: 加價變更寫稽核。
      parameters:
        - {name: modifierId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ModifierUpdate'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/Modifier'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_PRICE], 404: [MODIFIER_NOT_FOUND]}
    delete:
      tags: [menu]
      operationId: deleteModifier
      summary: 刪除選項（軟刪除）
      parameters:
        - {name: modifierId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '204': {description: 已刪除}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [MODIFIER_NOT_FOUND]}
  /api/pos/menu/items/{itemId}/image:
    put:
      tags: [menu]
      operationId: uploadItemImage
      summary: 上傳品項圖片
      description: |
        檔案 ≤ 2 MB；以檔案開頭位元組判斷 JPEG／PNG（不信任副檔名與內容類型）；先讀標頭寬高，超過 4000 像素拒絕，再完整解碼；重新編碼後儲存、去除 EXIF；
        新圖儲存成功後才刪舊檔。成功回傳的 `imageKey` 以 `getMenuImage` 取圖。
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/MenuItem'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [INVALID_IMAGE], 404: [MENU_ITEM_NOT_FOUND]}
    delete:
      tags: [menu]
      operationId: deleteItemImage
      summary: 刪除品項圖片
      description: 刪檔失敗只記日誌，不影響結果。
      parameters:
        - {name: itemId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 已刪除, content: {application/json: {schema: {$ref: '#/components/schemas/MenuItem'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [MENU_ITEM_NOT_FOUND]}
  /api/pos/tables:
    get:
      tags: [table]
      operationId: listTables
      summary: 桌位版面與目前用餐狀態（桌位看板）
      description: |
        依桌號自然排序（A2 在 A10 前），不含已刪除桌位。每桌帶「目前占桌的使用中用餐紀錄」摘要（無則為 null）。
        看板上的小計不在本回應（table 模組不依賴 order）；需要時以 `getSessionDetail` 取得。
      responses:
        '200': {description: 桌位, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TableView'}}}}}
    post:
      tags: [table]
      operationId: createTable
      summary: 新增桌位（TABLE_LAYOUT）
      description: 桌號去空白後不分大小寫唯一。方形與圓形的高度必須等於寬度，送了不同寬高回 `VALIDATION_ERROR`，不自動修正。
      security:
        - DeviceToken: []
          UnlockToken: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TableCreate'}}}
      responses:
        '201': {description: 已建立, content: {application/json: {schema: {$ref: '#/components/schemas/TableLayout'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [FORBIDDEN], 409: [TABLE_NO_DUPLICATE]}
  /api/pos/tables/{tableId}:
    patch:
      tags: [table]
      operationId: updateTable
      summary: 修改桌位（TABLE_LAYOUT）
      description: 使用中的桌位不可編輯。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: tableId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TableUpdate'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/TableLayout'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [FORBIDDEN], 404: [TABLE_NOT_FOUND], 409: [TABLE_OCCUPIED, TABLE_NO_DUPLICATE]}
    delete:
      tags: [table]
      operationId: deleteTable
      summary: 刪除桌位（TABLE_LAYOUT，軟刪除）
      description: 使用中的桌位不可刪除。
      security:
        - DeviceToken: []
          UnlockToken: []
      parameters:
        - {name: tableId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '204': {description: 已刪除}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {403: [FORBIDDEN], 404: [TABLE_NOT_FOUND], 409: [TABLE_OCCUPIED]}
  /api/pos/tables/{tableId}/open:
    post:
      tags: [table]
      operationId: openTable
      summary: 開桌
      description: |
        流程：鎖桌位 → 檢查未使用 → 鎖並遞增當日流水 → 建立用餐紀錄（token、QR 到期＝開桌＋4 小時、服務費預設值）→ 桌位使用中 → 發佈用餐開始。
        **回應不含 token**；token 只在 QR 圖片（`getSessionQr`）與 QR 列印單。同時開同一桌只一個成功，其餘回 409。
      parameters:
        - {name: tableId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OpenTableRequest'}}}
      responses:
        '201': {description: 已開桌, content: {application/json: {schema: {$ref: '#/components/schemas/SessionSummary'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 404: [TABLE_NOT_FOUND], 409: [TABLE_OCCUPIED, CONCURRENT_MODIFICATION]}
  /api/pos/sessions/pending-recheckout:
    get:
      tags: [table]
      operationId: listPendingRecheckout
      summary: 待重新結帳的用餐紀錄清單
      description: 作廢後重開且原桌已被占用或已刪除（不占桌重開）的用餐紀錄。
      responses:
        '200': {description: 清單, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SessionSummary'}}}}}
  /api/pos/sessions/{sessionId}/qr:
    get:
      tags: [table]
      operationId: getSessionQr
      summary: 取得顧客點餐 QR 圖片
      description: |
        網址＝公開基底網址（去結尾斜線）＋ `/customer/order/` ＋ 用餐紀錄編號 ＋ `#t=` token。
        只有「使用中」可取得；QR 有效期在查詢時判斷（過期仍可取得圖片，但顧客不能送新單）。
        需裝置憑證標頭，前端須以程式取得 blob 後顯示（不能直接用 img 標籤）。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: PNG 圖片
          headers:
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Cache-Control: {schema: {type: string, example: 'no-store'}}
          content:
            image/png: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {404: [SESSION_NOT_FOUND], 409: [SESSION_NOT_OPEN]}
  /api/pos/sessions/{sessionId}/guest-count:
    patch:
      tags: [table]
      operationId: updateGuestCount
      summary: 修改人數
      description: 用餐紀錄須使用中且非結帳中；待重新結帳的不可改。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OpenTableRequest'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/SessionSummary'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 404: [SESSION_NOT_FOUND], 409: [SESSION_NOT_OPEN, SESSION_PENDING_RECHECKOUT, CHECKOUT_IN_PROGRESS]}
  /api/pos/sessions/{sessionId}/service-charge:
    put:
      tags: [table]
      operationId: setServiceCharge
      summary: 服務費開關（PIN，寫稽核）
      description: 條件同修改人數。依 §4.4「狀態檢查之後才驗 PIN」，避免用錯 PIN 探測資料狀態。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ServiceChargeRequest'}}}
      responses:
        '200': {description: 已更新, content: {application/json: {schema: {$ref: '#/components/schemas/SessionSummary'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 404: [SESSION_NOT_FOUND], 409: [SESSION_NOT_OPEN, SESSION_PENDING_RECHECKOUT, CHECKOUT_IN_PROGRESS], 429: [PIN_LOCKED]}
  /api/pos/sessions/{sessionId}:
    get:
      tags: [order]
      operationId: getSessionDetail
      summary: 用餐詳情
      description: |
        用餐紀錄、草稿、所有正式單（含已取消）、小計。小計只算正式單未取消品項，**不含草稿與服務費**。
        任何狀態的用餐紀錄都可查詢。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 用餐詳情, content: {application/json: {schema: {$ref: '#/components/schemas/SessionDetail'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [SESSION_NOT_FOUND]}
  /api/pos/sessions/{sessionId}/draft/items:
    post:
      tags: [order]
      operationId: addDraftItem
      summary: 草稿新增品項
      description: |
        每個用餐紀錄最多一張草稿（不存在則建立）。價格以最新菜單為準；草稿不寫歷史、不發事件。
        前置檢查：用餐紀錄使用中、非結帳中、非待重新結帳。選項驗證依序：數量 1～99 → 同一選項不重複 → 選項屬於品項的群組 → 每群不同選項數在最少與最多之間（不允許重複時數量不大於 1）。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OrderItemInput'}}}
      responses:
        '201': {description: 已新增（回傳整張草稿）, content: {application/json: {schema: {$ref: '#/components/schemas/DraftView'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_QUANTITY, INVALID_MODIFIER_SELECTION, MODIFIER_DUPLICATE_NOT_ALLOWED, MODIFIER_GROUP_SELECTION_OUT_OF_RANGE], 404: [SESSION_NOT_FOUND, MENU_ITEM_NOT_FOUND], 409: [SESSION_NOT_OPEN, SESSION_PENDING_RECHECKOUT, CHECKOUT_IN_PROGRESS, MENU_ITEM_NOT_SELLABLE]}
  /api/pos/sessions/{sessionId}/draft/items/{draftItemId}:
    put:
      tags: [order]
      operationId: replaceDraftItem
      summary: 草稿修改品項（整筆取代）
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: draftItemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OrderItemInput'}}}
      responses:
        '200': {description: 已更新（回傳整張草稿）, content: {application/json: {schema: {$ref: '#/components/schemas/DraftView'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
