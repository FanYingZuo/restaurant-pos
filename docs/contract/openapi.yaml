      required: [batchNo, submittedAt, note, items]
      properties:
        batchNo: {type: integer}
        submittedAt: {type: string, format: date-time}
        note: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/CustomerOrderItem'}
    CustomerOrderItem:
      type: object
      required: [name, quantity, modifiers, note, status]
      properties:
        name: {type: string}
        quantity: {type: integer}
        modifiers:
          type: array
          items: {$ref: '#/components/schemas/KdsModifier'}
        note: {type: string}
        status: {$ref: '#/components/schemas/ItemStatus'}
    CheckoutStatus:
      type: string
      description: 結帳中／已完成／已作廢／已放棄（前兩者佔「有效帳單」位置）
      enum: [IN_PROGRESS, COMPLETED, VOIDED, ABANDONED]
    PaymentStatus:
      type: string
      description: 待處理／成功／失敗／已作廢／已退回
      enum: [PENDING, SUCCESS, FAILED, VOIDED, REFUNDED]
    PaymentMethod:
      type: object
      required: [code, name, enabled, displayOrder]
      properties:
        code: {type: string, example: CASH}
        name: {type: string}
        enabled: {type: boolean}
        displayOrder: {type: integer}
    CheckoutLine:
      type: object
      required: [orderItemId, name, quantity, unitPrice, lineTotal, itemStatus, modifiers]
      properties:
        orderItemId: {type: integer, format: int64}
        name: {type: string}
        quantity: {type: integer}
        unitPrice: {$ref: '#/components/schemas/Money'}
        lineTotal: {$ref: '#/components/schemas/Money'}
        itemStatus: {$ref: '#/components/schemas/ItemStatus'}
        modifiers:
          type: array
          items: {$ref: '#/components/schemas/ItemModifierView'}
    CheckoutCharge:
      type: object
      required: [name, rate, amount]
      properties:
        name: {type: string, example: 服務費}
        rate: {type: number, example: 0.1}
        amount: {$ref: '#/components/schemas/Money'}
    Payment:
      type: object
      required: [id, paymentKey, methodCode, receivedAmount, appliedAmount, changeAmount, status, createdAt]
      properties:
        id: {type: integer, format: int64}
        paymentKey: {$ref: '#/components/schemas/RequestKey'}
        methodCode: {type: string}
        receivedAmount: {$ref: '#/components/schemas/Money'}
        appliedAmount: {$ref: '#/components/schemas/Money'}
        changeAmount: {$ref: '#/components/schemas/Money'}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        createdAt: {type: string, format: date-time}
    Checkout:
      type: object
      description: 已付、找零、未付由成功付款計算。
      required: [id, sessionId, billNo, status, lines, subtotal, charges, discount, total, paid, change, unpaid, quickAmounts, payments, createdAt]
      properties:
        id: {type: integer, format: int64}
        sessionId: {type: integer, format: int64}
        billNo: {$ref: '#/components/schemas/BillNo'}
        status: {$ref: '#/components/schemas/CheckoutStatus'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/CheckoutLine'}
        subtotal: {$ref: '#/components/schemas/Money'}
        charges:
          type: array
          items: {$ref: '#/components/schemas/CheckoutCharge'}
        discount: {$ref: '#/components/schemas/Money'}
        total: {$ref: '#/components/schemas/Money'}
        paid: {$ref: '#/components/schemas/Money'}
        change: {$ref: '#/components/schemas/Money'}
        unpaid: {$ref: '#/components/schemas/Money'}
        quickAmounts:
          type: array
          description: '{未付、向上取整到 100、500、1000} 去重排序（1096 → 1096、1100、1500、2000）；已付清為空列表'
          items: {$ref: '#/components/schemas/Money'}
        payments:
          type: array
          items: {$ref: '#/components/schemas/Payment'}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
    PayRequest:
      type: object
      required: [paymentKey, methodCode, receivedAmount]
      properties:
        paymentKey: {$ref: '#/components/schemas/RequestKey'}
        methodCode: {type: string, maxLength: 32}
        receivedAmount: {type: number, exclusiveMinimum: true, minimum: 0, description: 實收；必須為正整數，有小數回 PAYMENT_AMOUNT_INVALID（所以請求型別為 number）}
    ReceiptLine:
      type: object
      required: [name, quantity, unitPrice, lineTotal, modifiers]
      properties:
        name: {type: string}
        quantity: {type: integer}
        unitPrice: {$ref: '#/components/schemas/Money'}
        lineTotal: {$ref: '#/components/schemas/Money'}
        modifiers:
          type: array
          items: {type: string}
    ReceiptPayment:
      type: object
      required: [methodName, receivedAmount, appliedAmount]
      properties:
        methodName: {type: string}
        receivedAmount: {$ref: '#/components/schemas/Money'}
        appliedAmount: {$ref: '#/components/schemas/Money'}
    Receipt:
      type: object
      required: [storeName, tableNo, billNo, status, lines, subtotal, charges, total, text]
      properties:
        storeName: {type: string, description: 未設定則為「餐廳」}
        tableNo: {type: string}
        billNo: {$ref: '#/components/schemas/BillNo'}
        status: {$ref: '#/components/schemas/CheckoutStatus'}
        completedAt: {type: string, format: date-time, nullable: true}
        lines:
          type: array
          items: {$ref: '#/components/schemas/ReceiptLine'}
        subtotal: {$ref: '#/components/schemas/Money'}
        charges:
          type: array
          items: {$ref: '#/components/schemas/CheckoutCharge'}
        total: {$ref: '#/components/schemas/Money'}
        payments:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ReceiptPayment'}
        change: {type: integer, format: int64, nullable: true, description: 未完成時為 null}
        text: {type: string, description: 收據純文字}
    RevenueRow:
      type: object
      required: [tableCount, guestCount, revenue, subtotal, serviceCharge, voidCount, abandonCount, refundCount, cancelledItemCount]
      properties:
        tableCount: {type: integer, description: 桌數}
        guestCount: {type: integer, description: 人數}
        revenue: {$ref: '#/components/schemas/Money'}
        subtotal: {$ref: '#/components/schemas/Money'}
        serviceCharge: {$ref: '#/components/schemas/Money'}
        voidCount: {type: integer, description: 作廢數}
        abandonCount: {type: integer, description: 放棄數}
        refundCount: {type: integer, description: 退回付款數}
        cancelledItemCount: {type: integer, description: 取消品項數}
    RevenueDay:
      allOf:
        - $ref: '#/components/schemas/RevenueRow'
        - type: object
          required: [businessDate]
          properties:
            businessDate: {type: string, format: date}
    RevenueReport:
      type: object
      required: [from, to, days, total]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        days:
          type: array
          items: {$ref: '#/components/schemas/RevenueDay'}
        total: {$ref: '#/components/schemas/RevenueRow'}
    TodayOverview:
      type: object
      required: [businessDate, revenue, openTableCount, onDutyCount]
      properties:
        businessDate: {type: string, format: date}
        revenue: {$ref: '#/components/schemas/Money'}
        openTableCount: {type: integer, description: 使用中桌數}
        onDutyCount: {type: integer, description: 上班中人數}
    DayCloseRequest:
      type: object
      required: [date, reserveFund, countedCash, pin]
      properties:
        date: {type: string, format: date}
        reserveFund: {type: integer, minimum: 0}
        countedCash: {type: integer, minimum: 0}
        pin: {$ref: '#/components/schemas/Pin'}
    DayCloseView:
      type: object
      required: [businessDate, reserveFund, cashReceived, expectedCash, countedCash, difference]
      properties:
        businessDate: {type: string, format: date}
        reserveFund: {$ref: '#/components/schemas/Money'}
        cashReceived: {$ref: '#/components/schemas/Money'}
        expectedCash: {$ref: '#/components/schemas/Money'}
        countedCash: {$ref: '#/components/schemas/Money'}
        difference: {type: integer, format: int64, description: 實點−預期（可為負）}
    DayCloseRecord:
      allOf:
        - $ref: '#/components/schemas/DayCloseView'
        - type: object
          required: [id, closedAt, employeeId, employeeName]
          properties:
            id: {type: integer, format: int64}
            closedAt: {type: string, format: date-time}
            employeeId: {type: integer, format: int64}
            employeeName: {type: string}
    WorkHoursRow:
      type: object
      required: [employeeId, employeeName, minutes, shiftCount, includesCorrected]
      properties:
        employeeId: {type: integer, format: int64}
        employeeName: {type: string}
        minutes: {type: integer}
        shiftCount: {type: integer}
        includesCorrected: {type: boolean, description: 該期間內含已更正班次}
    WorkHoursGroup:
      type: object
      required: [periodStart, periodEnd, rows]
      properties:
        periodStart: {type: string, format: date}
        periodEnd: {type: string, format: date}
        rows:
          type: array
          items: {$ref: '#/components/schemas/WorkHoursRow'}
    WorkHoursReport:
      type: object
      required: [groupBy, groups, anomalies]
      properties:
        groupBy: {type: string, enum: [DAY, WEEK, MONTH]}
        groups:
          type: array
          items: {$ref: '#/components/schemas/WorkHoursGroup'}
        anomalies:
          type: array
          items: {$ref: '#/components/schemas/ShiftRecord'}
    PrintJobType:
      type: string
      description: QR 單／廚房單／修改單／取消單／收據
      enum: [QR, KITCHEN, MODIFY, CANCEL, RECEIPT]
    PrintJobStatus:
      type: string
      description: 待列印／已列印／失敗
      enum: [PENDING, PRINTED, FAILED]
    PrintJobSource:
      type: string
      description: 業務事件／手動重印
      enum: [EVENT, REPRINT]
    PrintJobSummary:
      type: object
      description: 不含內容。`lastError` 為錯誤摘要，不得含機密值。
      required: [id, type, target, status, attempts, source, createdAt]
      properties:
        id: {type: integer, format: int64}
        type: {$ref: '#/components/schemas/PrintJobType'}
        target: {type: string, description: 站別（K1、K2）或收據印表機（RECEIPT）}
        status: {$ref: '#/components/schemas/PrintJobStatus'}
        attempts: {type: integer, description: 嘗試次數；上限 5 次}
        nextAttemptAt: {type: string, format: date-time, nullable: true}
        lastError: {type: string, nullable: true}
        source: {$ref: '#/components/schemas/PrintJobSource'}
        relatedId: {type: integer, format: int64, nullable: true, description: 相關編號（用餐紀錄、訂單或帳單）}
        createdAt: {type: string, format: date-time}
        printedAt: {type: string, format: date-time, nullable: true}
