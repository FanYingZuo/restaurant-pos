      properties:
        id: {type: integer, format: int64}
        occurredAt: {type: string, format: date-time}
        businessDate: {type: string, format: date}
        action: {type: string, description: 動作代碼}
        targetType: {type: string, nullable: true}
        targetId: {type: string, nullable: true}
        beforeValue: {type: string, nullable: true, description: 前值（不含任何機密值）}
        afterValue: {type: string, nullable: true, description: 後值（不含任何機密值）}
        employeeId: {type: integer, format: int64, nullable: true}
        deviceId: {type: integer, format: int64, nullable: true}
        reason: {type: string, nullable: true}
    AuditLogPage:
