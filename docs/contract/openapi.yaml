      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        displayOrder: {type: integer, minimum: 0, maximum: 9999, description: 省略則排在最後}
        active: {type: boolean, default: true}
    CategoryUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        displayOrder: {type: integer, minimum: 0, maximum: 9999}
        active: {type: boolean}
    ItemCreate:
      type: object
      required: [categoryId, name, price, station]
      properties:
        categoryId: {type: integer, format: int64}
        name: {type: string, minLength: 1, maxLength: 80}
        price: {type: number, minimum: 0, maximum: 9999999, description: 必須為整數；有小數回 INVALID_PRICE（所以請求型別為 number）}
        station: {$ref: '#/components/schemas/Station'}
        active: {type: boolean, default: false}
    ItemUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        price: {type: number, minimum: 0, maximum: 9999999, description: 同 ItemCreate.price}
        station: {$ref: '#/components/schemas/Station'}
        active: {type: boolean}
    ModifierGroupCreate:
      type: object
      required: [name, minSelect, maxSelect]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        minSelect: {type: integer, minimum: 0, maximum: 20}
        maxSelect: {type: integer, minimum: 1, maximum: 20}
        allowDuplicate: {type: boolean, default: false}
    ModifierGroupUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        minSelect: {type: integer, minimum: 0, maximum: 20}
        maxSelect: {type: integer, minimum: 1, maximum: 20}
        allowDuplicate: {type: boolean}
    ModifierCreate:
      type: object
      required: [name, priceDelta]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        priceDelta: {type: number, minimum: 0, maximum: 9999999, description: 必須為整數，0 允許；有小數回 INVALID_PRICE}
    ModifierUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        priceDelta: {type: number, minimum: 0, maximum: 9999999}
