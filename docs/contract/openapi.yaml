    EmployeeRole:
      type: string
      enum: [STAFF, MANAGER]
    Employee:
      type: object
      required: [id, name, role, active, createdAt]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, minLength: 1, maxLength: 50}
        role: {$ref: '#/components/schemas/EmployeeRole'}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
    EmployeeCreate:
      type: object
      required: [name, role, pin]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        role: {$ref: '#/components/schemas/EmployeeRole'}
        pin: {$ref: '#/components/schemas/Pin'}
    EmployeeUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        role: {$ref: '#/components/schemas/EmployeeRole'}
    ShiftCreate:
      type: object
      required: [employeeId, clockInAt, clockOutAt, reason]
      properties:
        employeeId: {type: integer, format: int64}
