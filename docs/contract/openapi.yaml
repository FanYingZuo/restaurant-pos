        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 404: [SESSION_NOT_FOUND], 409: [SESSION_NOT_OPEN, SESSION_PENDING_RECHECKOUT, CHECKOUT_IN_PROGRESS, SESSION_HAS_SUBMITTED_ORDERS], 429: [PIN_LOCKED]}
  /api/kds/stations/{station}/items:
    get:
      tags: [kds]
      operationId: listStationItems
      summary: 站別待處理與製作中品項清單
      description: |
        `station` 為 `K1` 或 `K2`；其他值回 404 `NOT_FOUND`。
        清單規則：站別符合；待處理或製作中；屬於正式單；用餐紀錄為使用中，或**今天營業日已結束**（先付後吃）；已取消不列；依品項編號遞增。
        一次查詢取回品項、選項、桌號，不在迴圈內逐筆查詢。
      parameters:
        - {name: station, in: path, required: true, schema: {type: string, maxLength: 8}}
      responses:
        '200': {description: 清單, content: {application/json: {schema: {$ref: '#/components/schemas/KdsBoard'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [NOT_FOUND]}
  /api/kds/stations/{station}/items/{orderItemId}/start:
    post:
      tags: [kds]
      operationId: startItem
      summary: 開始製作（待處理 → 製作中）
      description: |
        直接呼叫訂單模組的品項狀態服務。檢查依序：品項存在 → 站別符合 → 用餐紀錄使用中或已結束 → 未取消 → 版本相符 → 轉換合法。
        廚房狀態變更**不檢查結帳旗標**；用餐紀錄已取消則拒絕。只發事件（推播），不寫列印。
      parameters:
        - {name: station, in: path, required: true, schema: {type: string, maxLength: 8}}
        - {name: orderItemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KdsTransitionRequest'}}}
      responses:
        '200': {description: 已變更, content: {application/json: {schema: {$ref: '#/components/schemas/KdsTransitionResult'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [KDS_STATION_FORBIDDEN], 404: [NOT_FOUND, KDS_ITEM_NOT_FOUND], 409: [SESSION_NOT_OPEN, ORDER_ITEM_CANCELLED, CONCURRENT_MODIFICATION, INVALID_ORDER_ITEM_TRANSITION]}
  /api/kds/stations/{station}/items/{orderItemId}/complete:
    post:
      tags: [kds]
      operationId: completeItem
      summary: 完成（待處理或製作中 → 已完成）
      description: 規則同 `startItem`。
      parameters:
        - {name: station, in: path, required: true, schema: {type: string, maxLength: 8}}
        - {name: orderItemId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KdsTransitionRequest'}}}
      responses:
        '200': {description: 已變更, content: {application/json: {schema: {$ref: '#/components/schemas/KdsTransitionResult'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [KDS_STATION_FORBIDDEN], 404: [NOT_FOUND, KDS_ITEM_NOT_FOUND], 409: [SESSION_NOT_OPEN, ORDER_ITEM_CANCELLED, CONCURRENT_MODIFICATION, INVALID_ORDER_ITEM_TRANSITION]}
  /ws:
    get:
      tags: [kds]
      operationId: webSocketHandshake
      summary: WebSocket（STOMP）端點
      description: |
        **這不是 REST 操作，僅用來在文件中記載 WebSocket 合約。** 原生 WebSocket（不用 SockJS）。

        **連線**：HTTP 握手放行；裝置憑證放在 **STOMP CONNECT 帧的 `X-Device-Token` 標頭**，不放網址參數。CONNECT 時驗證，憑證缺少或無效 → 回 ERROR 帧並斷線。POS 與 KDS 皆可連線。來源（Origin）只允許公開基底網址。
        **心跳**：伺服器每 25 秒送一次；**每次心跳重新檢查裝置**，裝置已撤銷則斷線。
        **主題**（用戶端只訂閱，傳入訊息一律忽略）：`/topic/kds/K1`、`/topic/kds/K2`。
        **訊息**（JSON，內容見 `KdsMessage`）：`ITEM_UPSERT`（品項新增或更新，完整資料）、`ITEM_REMOVE`（品項移除，只帶編號）、`BOARD_RELOAD`（整板重新載入）。
        訊息對應事件見 01-PLAN §4.7：訂單送出／品項修改／品項開始製作 → `ITEM_UPSERT`；品項完成／品項取消 → `ITEM_REMOVE`；用餐取消、結束不收費 → 兩站各一則 `BOARD_RELOAD`。
        推播在交易**提交後**執行，失敗只記日誌；監聽器重新讀取資料，讀不到就改送 `ITEM_REMOVE`。

        **可靠性契約（前端必須遵守）**：至少送一次、不保證順序；以「`orderItemId` ＋ `version`」去重，只套用版本 ≥ 目前版本的更新，**移除一律套用**；斷線重連後整份重新載入（`listStationItems`）；每 60 秒定時對帳；60 秒沒收到任何訊息視為斷線。
      responses:
        '101': {description: 切換為 WebSocket}
  /api/customer/menu:
    get:
      tags: [customer]
      operationId: getCustomerMenu
      summary: 顧客菜單（無需驗證）
      description: 只含上架分類中的可售品項；空分類不出現；加價為 0 也回傳。依顯示順序。不含站別、上下架、售完日等內部欄位。
      security: []
      responses:
        '200': {description: 菜單, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerMenu'}}}}
  /api/customer/images/{imageKey}:
    get:
      tags: [customer]
      operationId: getMenuImage
      summary: 菜單圖片（無需驗證）
      description: 讀取前先驗證鍵格式（防路徑穿越）；回應帶「禁止猜測內容類型」與可快取標頭。
      security: []
      parameters:
        - {name: imageKey, in: path, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: JPEG 或 PNG
          headers:
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Cache-Control: {schema: {type: string, example: 'public, max-age=86400'}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [NOT_FOUND]}
  /api/customer/sessions/{sessionId}:
    get:
      tags: [customer]
      operationId: verifyCustomerSession
      summary: 驗證用餐紀錄並取得點餐狀態
      description: |
        缺 token 或長度不符、用餐紀錄不存在、token 不符，一律回**完全相同**的 401 `SESSION_TOKEN_INVALID`；驗證本身不檢查狀態與過期。
        `canOrder`＝使用中、未過期、非結帳中、不是待重新結帳。
      security:
        - SessionToken: []
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 目前狀態, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerSession'}}}}
        '401': {$ref: '#/components/responses/E401'}
      x-error-codes: {401: [SESSION_TOKEN_INVALID]}
  /api/customer/sessions/{sessionId}/orders:
    post:
      tags: [customer]
      operationId: submitCustomerOrder
      summary: 顧客送單
      description: |
        流程：token 驗證 → 鎖用餐紀錄並重新比對 token 與狀態 → 冪等（內容雜湊）→ 過期 → 結帳中 → 送單間隔 1 秒 → 單張超過 30 項或正式單已達 50 張（同一步檢查）→ 每項可售與選項驗證 → 建立正式單（來源顧客）→ 寫歷史 → 發佈訂單送出。
        內容雜湊：每品項為「菜單品項編號,數量,品項備註」，後接 `|` 與依編號排序的「選項編號:數量」（逗號連接）；品項間以 `;` 連接；最後加 `#` 與訂單備註；整串 SHA-256；請求編號不納入。
        例：`12,2,少辣|5:1,8:1;30,1,|#不要香菜`。
        新建立回 201；同請求編號且內容相同回 200 與原結果（過期後重送仍取得原結果）；同編號不同內容回 409 `DUPLICATE_REQUEST`。
      security:
        - SessionToken: []
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CustomerOrderRequest'}}}
      responses:
        '200': {description: 重播（原結果）, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerSubmitResult'}}}}
        '201': {description: 已送單, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerSubmitResult'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '401': {$ref: '#/components/responses/E401'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_QUANTITY, INVALID_MODIFIER_SELECTION, MODIFIER_DUPLICATE_NOT_ALLOWED, MODIFIER_GROUP_SELECTION_OUT_OF_RANGE], 401: [SESSION_TOKEN_INVALID], 404: [MENU_ITEM_NOT_FOUND], 409: [SESSION_NOT_OPEN, DUPLICATE_REQUEST, QR_EXPIRED, CHECKOUT_IN_PROGRESS, SESSION_PENDING_RECHECKOUT, CUSTOMER_ORDER_LIMIT, MENU_ITEM_NOT_SELLABLE, CONCURRENT_MODIFICATION], 429: [CUSTOMER_ORDER_TOO_FAST]}
    get:
      tags: [customer]
      operationId: listCustomerOrders
      summary: 查看本桌訂單與出餐狀態
      description: 該用餐紀錄所有正式單（含服務員送的），已取消品項標示 `CANCELLED`。**不含**內部編號、版本、取消原因、價格。過期後仍可查看。
      security:
        - SessionToken: []
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 訂單, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerOrders'}}}}
        '401': {$ref: '#/components/responses/E401'}
      x-error-codes: {401: [SESSION_TOKEN_INVALID]}
  /api/pos/payment-methods:
    get:
      tags: [checkout]
      operationId: listPaymentMethods
      summary: 付款方式清單
      description: 依排序。本規劃只有現金（`CASH`）；停用的付款方式仍列出（`enabled` 為 false）。
      responses:
        '200': {description: 付款方式, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PaymentMethod'}}}}}
  /api/pos/sessions/{sessionId}/checkout:
    post:
      tags: [checkout]
      operationId: startCheckout
      summary: 開始結帳
      description: |
        流程：鎖用餐紀錄 → 已有結帳中帳單就**直接回傳（200）** → 草稿有品項拒絕 → 沒有可結帳品項拒絕 → 建立帳單（**含未完成品項**）、計算服務費 → 結帳旗標為真（之後訂單、人數、服務費都被鎖住）→ 201。
        服務費＝小計×費率，HALF_UP 到整數（995 → 100、986 → 99）；折扣欄位保留為 0。待重新結帳的用餐紀錄可正常開始結帳。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 已有結帳中帳單（原帳單）, content: {application/json: {schema: {$ref: '#/components/schemas/Checkout'}}}}
        '201': {description: 已建立帳單, content: {application/json: {schema: {$ref: '#/components/schemas/Checkout'}}}}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {404: [SESSION_NOT_FOUND], 409: [SESSION_NOT_OPEN, UNSENT_ITEMS_EXIST, NOTHING_TO_CHECKOUT, CONCURRENT_MODIFICATION]}
  /api/pos/checkouts/{checkoutId}/payments:
    post:
      tags: [checkout]
      operationId: pay
      summary: 付款（可部分付款）
      description: |
        流程：冪等（`paymentKey`）在狀態檢查之前 → 帳單必須結帳中 → 付款方式啟用且有處理器 → 實收 > 0 且為整數 → 先建待處理付款 → 伺服器計算未付並呼叫處理器（前端不傳未付）→
        成功：記入帳與找零；已付 ≥ 總額就完成帳單、結束用餐紀錄、發佈結帳完成（列印收據）。
        失敗：標記付款失敗，**交易仍提交**，回 409 `PAYMENT_FAILED`（唯一「回錯誤但資料已提交」的地方）。
        現金入帳最多到未付，超出為找零；不足則付多少入多少，可再付。同時付足額只一筆完成、不超收。
        同 `paymentKey` ＋同內容回目前帳單（200）；內容不同回 409 `PAYMENT_IDEMPOTENCY_CONFLICT`。
      parameters:
        - {name: checkoutId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PayRequest'}}}
      responses:
        '200': {description: 目前帳單, content: {application/json: {schema: {$ref: '#/components/schemas/Checkout'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {400: [VALIDATION_ERROR, PAYMENT_AMOUNT_INVALID], 404: [CHECKOUT_NOT_FOUND], 409: [PAYMENT_IDEMPOTENCY_CONFLICT, CHECKOUT_NOT_IN_PROGRESS, PAYMENT_METHOD_DISABLED, PAYMENT_FAILED, CONCURRENT_MODIFICATION]}
  /api/pos/checkouts/{checkoutId}/payments/{paymentId}/refund:
    post:
      tags: [checkout]
      operationId: refundPayment
      summary: 退回付款（PIN）
      description: 帳單結帳中、付款成功才可退回。狀態檢查之後驗 PIN 與理由 → 處理器作廢（失敗整筆回滾）→ 付款已退回、扣回已付與找零 → 寫稽核。
      parameters:
        - {name: checkoutId, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: paymentId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PinReasonRequest'}}}
      responses:
        '200': {description: 已退回（回傳帳單）, content: {application/json: {schema: {$ref: '#/components/schemas/Checkout'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 404: [CHECKOUT_NOT_FOUND, NOT_FOUND], 409: [CHECKOUT_NOT_IN_PROGRESS, PAYMENT_NOT_REFUNDABLE, VOID_FAILED], 429: [PIN_LOCKED]}
  /api/pos/checkouts/{checkoutId}/abandon:
    post:
      tags: [checkout]
      operationId: abandonCheckout
      summary: 放棄結帳
      description: 還有成功付款就拒絕（須先退回）；帳單標記已放棄、紀錄全部保留、清除結帳旗標、寫稽核。不需 PIN。
      parameters:
        - {name: checkoutId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 已放棄, content: {application/json: {schema: {$ref: '#/components/schemas/Checkout'}}}}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {404: [CHECKOUT_NOT_FOUND], 409: [CHECKOUT_NOT_IN_PROGRESS, CHECKOUT_HAS_PAYMENTS]}
  /api/pos/checkouts/{checkoutId}/void:
    post:
      tags: [checkout]
      operationId: voidCheckout
      summary: 作廢帳單（PIN）
      description: |
        必須已完成且為**今天營業日**；驗 PIN 與理由 → 每筆成功付款呼叫處理器作廢（任一失敗整筆回滾）→ 帳單與付款已作廢 → 用餐紀錄重開（原桌空著占桌重開；被占或已刪除不占桌重開並標記待重新結帳）→ 發佈結帳作廢。之後依當下設定重新結帳。
      parameters:
        - {name: checkoutId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PinReasonRequest'}}}
      responses:
        '200': {description: 已作廢, content: {application/json: {schema: {$ref: '#/components/schemas/Checkout'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 404: [CHECKOUT_NOT_FOUND], 409: [CHECKOUT_NOT_VOIDABLE, CHECKOUT_VOID_NOT_SAME_DAY, VOID_FAILED], 429: [PIN_LOCKED]}
  /api/pos/sessions/{sessionId}/close-without-payment:
    post:
      tags: [checkout]
      operationId: closeWithoutPayment
      summary: 結束不收費（PIN）
      description: 只用於待重新結帳、且沒有結帳中帳單的用餐紀錄；PIN＋理由＋稽核，狀態改為已取消。不是待重新結帳回 409 `SESSION_NOT_OPEN`；有結帳中帳單回 409 `CHECKOUT_IN_PROGRESS`（先完成或放棄結帳）。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PinReasonRequest'}}}
      responses:
        '200': {description: 已結束, content: {application/json: {schema: {$ref: '#/components/schemas/SessionSummary'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR], 403: [INVALID_PIN], 404: [SESSION_NOT_FOUND], 409: [SESSION_NOT_OPEN, CHECKOUT_IN_PROGRESS], 429: [PIN_LOCKED]}
  /api/pos/checkouts/{checkoutId}/receipt:
    get:
      tags: [checkout]
      operationId: getReceiptPreview
      summary: 收據預覽
      description: |
        任何狀態的帳單都可預覽；未完成時 `payments` 與 `change` 為 null（省略付款區塊）。`text` 為收據純文字（與列印同一個純函式產生；結帳時間以台北時間顯示）。
      parameters:
        - {name: checkoutId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 收據, content: {application/json: {schema: {$ref: '#/components/schemas/Receipt'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [CHECKOUT_NOT_FOUND]}
  /api/pos/reports/revenue:
    get:
      tags: [report]
      operationId: getRevenueReport
      summary: 營業額報表（逐日）
      description: |
        起訖皆為營業日且**都算在內**，最多 92 個營業日（相差 91 天可以、92 天不行）；起晚於訖或超過 → `INVALID_DATE_RANGE`。
        沒資料的日子也回 0；另有合計列。聚合在 DB 完成，報表不改任何資料。
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: 報表, content: {application/json: {schema: {$ref: '#/components/schemas/RevenueReport'}}}}
        '400': {$ref: '#/components/responses/E400'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_DATE_RANGE]}
  /api/pos/reports/today:
    get:
      tags: [report]
      operationId: getTodayOverview
      summary: 今日總覽（即時，不快取）
      responses:
        '200': {description: 今日總覽, content: {application/json: {schema: {$ref: '#/components/schemas/TodayOverview'}}}}
  /api/pos/reports/day-close/preview:
    get:
      tags: [report]
      operationId: previewDayClose
      summary: 日結預覽（免 PIN）
      description: |
        預期現金＝備用金＋當日完成帳單的現金入帳（不含找零，依帳單營業日）；差額＝實點−預期。預覽與存檔用同一函式。不能日結未來。
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: reserveFund, in: query, required: true, schema: {type: integer, minimum: 0}}
        - {name: countedCash, in: query, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: 日結試算, content: {application/json: {schema: {$ref: '#/components/schemas/DayCloseView'}}}}
        '400': {$ref: '#/components/responses/E400'}
      x-error-codes: {400: [VALIDATION_ERROR, DAY_CLOSE_FUTURE_DATE]}
  /api/pos/reports/day-close:
    post:
      tags: [report]
      operationId: saveDayClose
      summary: 日結存檔（PIN）
      description: 先檢查日期（未來日期回 `DAY_CLOSE_FUTURE_DATE`）再驗 PIN；同一天可多筆，最新為準；不鎖資料。這是報表模組唯一的寫入。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DayCloseRequest'}}}
      responses:
        '201': {description: 已存檔, content: {application/json: {schema: {$ref: '#/components/schemas/DayCloseRecord'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '403': {$ref: '#/components/responses/E403'}
        '429': {$ref: '#/components/responses/E429'}
      x-error-codes: {400: [VALIDATION_ERROR, DAY_CLOSE_FUTURE_DATE], 403: [INVALID_PIN], 429: [PIN_LOCKED]}
  /api/pos/reports/work-hours:
    get:
      tags: [report]
      operationId: getWorkHoursReport
      summary: 工時報表
      description: |
        依日、週（週一起算）、月分組，可依員工篩選；只計完整班次（含更正後完整的，標示「已更正」）；歸屬上班營業日；已停用員工名稱仍顯示。
        異常清單列出上班未打卡與下班未打卡的班次（不計工時）。
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: groupBy, in: query, required: false, schema: {type: string, enum: [DAY, WEEK, MONTH], default: DAY}}
        - {name: employeeId, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200': {description: 報表, content: {application/json: {schema: {$ref: '#/components/schemas/WorkHoursReport'}}}}
        '400': {$ref: '#/components/responses/E400'}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {400: [VALIDATION_ERROR, INVALID_DATE_RANGE], 404: [EMPLOYEE_NOT_FOUND]}
  /api/pos/print/problems:
    get:
      tags: [print]
      operationId: listPrintProblems
      summary: 列印問題清單
      description: |
        列出狀態為失敗、以及等待超過 30 秒仍未列印的工作。**不回傳內容**（內容含 QR 網址的 token），只回類型、目標、狀態、嘗試次數、錯誤摘要、時間。
      responses:
        '200': {description: 問題工作, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PrintJobSummary'}}}}}
  /api/pos/print/jobs/{jobId}/reprint:
    post:
      tags: [print]
      operationId: reprintJob
      summary: 重印單據
      description: 建立一筆新工作（原工作保留），內容與原工作完全相同（內容在建立時固定）。
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '201': {description: 已建立新工作, content: {application/json: {schema: {$ref: '#/components/schemas/PrintJobSummary'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [PRINT_JOB_NOT_FOUND]}
  /api/pos/sessions/{sessionId}/reprint-qr:
    post:
      tags: [print]
      operationId: reprintQr
      summary: 重印 QR 單
      description: 不產生新 token；用餐紀錄非使用中則拒絕（規格寫「用餐已結束」，對應 409 `SESSION_NOT_OPEN`）。
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '201': {description: 已建立新工作, content: {application/json: {schema: {$ref: '#/components/schemas/PrintJobSummary'}}}}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
      x-error-codes: {404: [SESSION_NOT_FOUND], 409: [SESSION_NOT_OPEN]}
  /api/pos/checkouts/{checkoutId}/reprint-receipt:
    post:
      tags: [print]
      operationId: reprintReceipt
      summary: 重印收據
      description: 以收據純函式重新產生內容並建立新工作。
      parameters:
        - {name: checkoutId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '201': {description: 已建立新工作, content: {application/json: {schema: {$ref: '#/components/schemas/PrintJobSummary'}}}}
        '404': {$ref: '#/components/responses/E404'}
      x-error-codes: {404: [CHECKOUT_NOT_FOUND]}
components:
  securitySchemes:
    DeviceToken: {type: apiKey, in: header, name: X-Device-Token, description: 裝置憑證（配對時只回傳一次）}
    UnlockToken: {type: apiKey, in: header, name: X-Unlock-Token, description: 管理者解鎖憑證（單一功能有效）}
    SessionToken: {type: apiKey, in: header, name: X-Session-Token, description: '顧客 Session token（來自 QR 網址片段 #t=，不出現在任何 API 回應）'}
  responses:
    E400: {description: 格式或數值不合法, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    E401: {description: 裝置憑證或顧客 token 無效, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    E403: {description: 權限不足／PIN 錯誤／明確禁止, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    E404: {description: 找不到, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    E409: {description: 狀態衝突／重複請求／併發衝突, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    E429: {description: 操作太頻繁或已被鎖定, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      type: object
      description: 錯誤回應只含錯誤碼、固定繁體中文訊息、時間戳，不含堆疊與機密值。
      required: [code, message, timestamp]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string}
        timestamp: {type: string, format: date-time}
    ErrorCode:
      type: string
      description: 01-PLAN §4.8 錯誤碼全集；本表以外不得新增。`TABLE_UNAVAILABLE` 保留、本規劃不使用；`DEVICE_TOKEN_INVALID`、`DEVICE_TYPE_FORBIDDEN`、`INTERNAL_ERROR`、`METHOD_NOT_ALLOWED`、`UNSUPPORTED_MEDIA_TYPE` 為全域或框架層錯誤，不在各操作列出。
      enum:
        - VALIDATION_ERROR
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - UNSUPPORTED_MEDIA_TYPE
        - FORBIDDEN
        - CONCURRENT_MODIFICATION
        - INTERNAL_ERROR
        - DUPLICATE_REQUEST
        - DEVICE_TOKEN_INVALID
        - DEVICE_TYPE_FORBIDDEN
        - PAIRING_CODE_INVALID
        - PAIRING_LOCKED
        - DEVICE_SELF_REVOKE
        - INVALID_PIN
        - PIN_LOCKED
        - NOT_MANAGER
        - ALREADY_CLOCKED_IN
        - CLOCK_TOO_FAST
        - EMPLOYEE_NOT_FOUND
        - PIN_ALREADY_USED
        - LAST_MANAGER
        - SHIFT_CORRECTION_INVALID
        - SHIFT_CORRECTION_TOO_OLD
        - SHIFT_CORRECTION_SELF
        - MENU_CATEGORY_NOT_FOUND
        - MENU_CATEGORY_IN_USE
        - MENU_ITEM_NOT_FOUND
        - MENU_ITEM_NOT_ARCHIVED
        - MENU_ITEM_NOT_SELLABLE
        - MODIFIER_GROUP_NOT_FOUND
        - MODIFIER_NOT_FOUND
        - INVALID_PRICE
        - INVALID_IMAGE
        - INVALID_SORT_REQUEST
        - TABLE_NOT_FOUND
        - TABLE_NO_DUPLICATE
        - TABLE_OCCUPIED
        - TABLE_UNAVAILABLE
        - SESSION_NOT_FOUND
        - SESSION_NOT_OPEN
        - SESSION_HAS_SUBMITTED_ORDERS
        - SESSION_PENDING_RECHECKOUT
        - QR_EXPIRED
        - SESSION_TOKEN_INVALID
        - CUSTOMER_ORDER_LIMIT
        - CUSTOMER_ORDER_TOO_FAST
        - INVALID_QUANTITY
        - ORDER_NOT_FOUND
        - ORDER_ITEM_NOT_FOUND
        - ORDER_ITEM_CANCELLED
        - ORDER_ITEM_ALREADY_READY
        - INVALID_ORDER_ITEM_TRANSITION
        - ORDER_NOT_EDITABLE
        - EMPTY_DRAFT
        - DRAFT_ITEM_NOT_FOUND
        - INVALID_MODIFIER_SELECTION
        - MODIFIER_GROUP_SELECTION_OUT_OF_RANGE
        - MODIFIER_DUPLICATE_NOT_ALLOWED
        - CHECKOUT_IN_PROGRESS
        - UNSENT_ITEMS_EXIST
        - NOTHING_TO_CHECKOUT
        - CHECKOUT_NOT_FOUND
        - CHECKOUT_NOT_IN_PROGRESS
        - CHECKOUT_NOT_VOIDABLE
        - CHECKOUT_VOID_NOT_SAME_DAY
        - CHECKOUT_HAS_PAYMENTS
        - PAYMENT_METHOD_DISABLED
        - PAYMENT_AMOUNT_INVALID
        - PAYMENT_FAILED
        - PAYMENT_IDEMPOTENCY_CONFLICT
        - PAYMENT_NOT_REFUNDABLE
        - VOID_FAILED
        - KDS_STATION_FORBIDDEN
        - KDS_ITEM_NOT_FOUND
        - INVALID_DATE_RANGE
        - DAY_CLOSE_FUTURE_DATE
        - PRINT_JOB_NOT_FOUND
    PageInfo:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    Pin:
      type: string
      pattern: '^[0-9]{4,6}$'
      description: 4～6 位數字。機密：不得出現在日誌、回應、測試快照。
    Reason:
      type: string
      minLength: 1
      maxLength: 255
    RequestKey:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    Money:
      type: integer
      format: int64
      description: 整數元。
    BillNo:
      type: string
      pattern: '^[0-9]{3,}$'
      description: 帳單號，三位數補零字串。
    PinRequest:
      type: object
      required: [pin]
      properties:
        pin: {$ref: '#/components/schemas/Pin'}
    PinReasonRequest:
      type: object
      required: [pin, reason]
      properties:
        pin: {$ref: '#/components/schemas/Pin'}
        reason: {$ref: '#/components/schemas/Reason'}
    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: integer, format: int64}
          description: 必須剛好等於該層所有未刪除項目；依位置從 0 重新編號。
    PairRequest:
      type: object
      required: [pairingCode]
      properties:
        pairingCode: {type: string, pattern: '^[A-Za-z0-9]{8}$', description: 8 位英數字一次性配對碼（機密）}
    PairResponse:
      type: object
      required: [deviceId, name, deviceType, deviceToken]
      properties:
        deviceId: {type: integer, format: int64}
        name: {type: string}
        deviceType: {$ref: '#/components/schemas/DeviceType'}
        deviceToken: {type: string, description: 裝置憑證（機密，只回傳這一次）}
    DeviceType:
      type: string
      enum: [POS, KDS]
    ShiftState:
      type: string
      description: 上班未打卡／下班未打卡／上班中／完整班次
      enum: [MISSING_CLOCK_IN, MISSING_CLOCK_OUT, ON_DUTY, COMPLETE]
    ClockAction:
      type: string
      enum: [CLOCK_IN, CLOCK_OUT]
    ClockWarning:
      type: string
      description: MISSING_CLOCK_IN＝沒上班就下班；MISSING_CLOCK_OUT＝前一營業日忘記下班
      enum: [MISSING_CLOCK_IN, MISSING_CLOCK_OUT]
    ShiftBrief:
      type: object
      required: [shiftId, businessDate, clockInAt, clockOutAt, minutes, state, corrected]
      properties:
        shiftId: {type: integer, format: int64}
        businessDate: {type: string, format: date, description: 歸屬上班營業日}
        clockInAt: {type: string, format: date-time, nullable: true}
        clockOutAt: {type: string, format: date-time, nullable: true}
